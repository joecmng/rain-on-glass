<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Rain on Glass: scene</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    iframe { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; display: block; }
  </style>
</head>
<body>
  <!-- YouTube rejects embeds opened as a bare top-level page ("Video player configuration
       error"), so the scene window hosts the player in an iframe on our own origin. -->
  <iframe id="player" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" title="Scene"></iframe>
  <script>
    function load() {
      const p = new URLSearchParams(location.search);
      const id = (p.get('v') || '').replace(/[^\w-]/g, '');
      const start = Math.max(0, parseInt(p.get('start') || '0', 10) || 0);
      if (!id) return;
      const q = new URLSearchParams({
        autoplay: '1', mute: '1', controls: '0', rel: '0', playsinline: '1', iv_load_policy: '3',
        loop: '1', playlist: id, start: String(start), origin: location.origin,
      });
      document.getElementById('player').src = `https://www.youtube-nocookie.com/embed/${id}?${q}`;
      document.title = p.get('title') ? `Scene: ${p.get('title')}` : 'Rain on Glass: scene';
    }
    load();
  </script>
</body>
</html>
