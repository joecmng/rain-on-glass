<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Rain on Glass</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="gl"></canvas>

  <!-- Controls: a small floating dock at the bottom. Each icon opens a card above it
       (tap again, tap the glass or press Esc to close). Draw turns the dock itself into a
       one-row drawing strip. Wiring: src/ui/dock.js (open/close), src/ui/ui.js and
       src/logo/panel.js (the controls). -->
  <div id="panel" class="dock-wrap">

    <!-- Weather: rain, speed, fog, wind -->
    <section class="dock-card" data-card="weather" aria-label="Weather" hidden>
      <div class="card-title">Weather</div>
      <!-- audio controls: hidden for now; set features.audio = true in src/config.js to bring them back -->
      <div id="audioSection" hidden>
        <label class="row">Audio
          <select id="audioSrc">
            <option value="none">None (cruising)</option>
            <option value="display">Tab / system audio (YouTube…)</option>
            <option value="mic">Microphone</option>
            <option value="file">Audio file…</option>
            <option value="test">Test beat</option>
          </select>
        </label>
        <div id="audioStatus" class="status"></div>
        <audio id="player" controls hidden></audio>
        <label class="row">Sensitivity <input id="sensitivity" type="range" min="0" max="3" step="0.01" /><output></output></label>
      </div>
      <label class="row">Rain <input id="rain" type="range" min="0" max="2" step="0.01" /><output></output></label>
      <label class="row">Speed <input id="speed" type="range" min="0" max="2" step="0.01" /><output></output></label>
      <label class="row">Fog <input id="fog" type="range" min="0" max="1" step="0.01" /><output></output></label>
      <div class="row dialrow">
        <span>Wind</span>
        <div id="windDial" class="dial" role="slider" tabindex="0" aria-label="Wind direction (drag or use arrow keys; double-click to reset)"
             aria-valuemin="0" aria-valuemax="359" title="Drag to point the airflow. Double-click to reset.">
          <svg viewBox="-50 -50 100 100" aria-hidden="true">
            <circle class="dial-ring" r="44" />
            <g class="dial-ticks"></g>
            <g class="dial-gravity"><line x1="0" y1="30" x2="0" y2="42" /><text x="0" y="-1" dy="34" class="dial-g">g</text></g>
            <g id="windArrow" class="dial-arrow">
              <line x1="0" y1="-26" x2="0" y2="26" />
              <path d="M -8 18 L 0 34 L 8 18 Z" />
            </g>
            <circle class="dial-hub" r="4" />
          </svg>
        </div>
        <output id="windOut"></output>
      </div>
    </section>

    <!-- Scene: background, bokeh, streak style -->
    <section class="dock-card" data-card="scene" aria-label="Scene" hidden>
      <div class="card-title">Scene</div>
      <label class="row">Background
        <select id="bg">
          <option value="scenes">Scenic clips (random)</option>
          <option value="photos">City at night (photos)</option>
          <option value="youtube" id="bgYouTube" hidden disabled>YouTube scene (share window)</option>
          <option value="image">Image…</option>
          <option value="webcam">Webcam</option>
        </select>
      </label>
      <div id="sceneBox" class="scene-box" hidden>
        <div id="sceneText" class="scene-text"></div>
        <div class="buttons">
          <button id="sceneCapture" hidden>Capture scene window</button>
          <button id="scenePrev" hidden>◀ Previous</button>
          <button id="sceneNext">Next scene</button>
        </div>
      </div>
      <label class="row">Bokeh <input id="bokeh" type="range" min="0" max="1.5" step="0.01" /><output></output></label>
      <label class="row">Streaks <select id="streakStyle"></select></label>
    </section>

    <!-- Logo: upload, how it interacts with the rain, placement, mask fixes -->
    <section class="dock-card" data-card="logo" aria-label="Logo" hidden>
      <div class="card-title">Logo
        <span class="card-actions">
          <button id="logoUpload" title="PNG, JPG, WebP, GIF, SVG, PDF or AI">Upload…</button>
          <button id="logoRemove" hidden>Remove</button>
        </span>
      </div>
      <div id="logoEmptyHint" class="hint">Upload a logo or drop one on the window. Anything you draw joins in too.</div>
      <div id="logoBox" hidden>
        <div id="logoName" class="scene-text"></div>
        <label class="row" id="logoPageRow" hidden>Page <select id="logoPage"></select></label>
        <label class="row">Size <input id="logoSize" type="range" min="0.08" max="1.4" step="0.01" /><output></output></label>
      </div>
      <!-- how the logo / drawing interacts with the rain -->
      <div id="effectBox" hidden>
        <div id="logoTabs" class="tabs" role="tablist" aria-label="How the logo interacts with the rain"></div>
        <div id="logoModeTitle" class="scene-text"></div>
        <div id="logoModeSliders"></div>
      </div>
      <div id="logoTools" class="buttons">
        <button id="logoReset" title="Put the logo back in the middle">Re-centre</button>
        <button id="logoModeReset" title="Put this effect's sliders back to normal">Reset effect</button>
      </div>
      <details id="logoFix" class="more">
        <summary>Fix mask</summary>
        <label class="row">Mask
          <select id="logoMaskMode">
            <option value="auto">Auto</option>
            <option value="alpha">Transparency</option>
            <option value="luma">Dark areas</option>
          </select>
        </label>
        <label class="row">Threshold <input id="logoThreshold" type="range" min="0.05" max="0.95" step="0.01" /><output></output></label>
        <div class="row checks">
          <label><input id="logoInvert" type="checkbox" /> Invert</label>
          <label title="Shows the surface map the rain uses (M)"><input id="logoShowMask" type="checkbox" /> Show mask</label>
        </div>
      </details>
    </section>

    <!-- Settings -->
    <section class="dock-card" data-card="settings" aria-label="Settings" hidden>
      <div class="card-title">Settings</div>
      <label class="row">Quality
        <select id="quality">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="ultra">Ultra</option>
        </select>
      </label>
      <div class="buttons">
        <button id="fullscreen">Fullscreen</button>
        <button id="debugBtn">Debug (D)</button>
      </div>
      <div class="hint" id="dropHint">Drop a logo file anywhere.</div>
      <div class="hint">Keys: B draw · E eraser · Ctrl+Z undo · M mask · H hide · F fullscreen · D debug</div>
    </section>

    <!-- the dock itself -->
    <nav class="dock" aria-label="Controls">
      <div class="dock-icons">
        <button class="dock-btn" data-open="weather" aria-label="Weather" title="Weather: rain, speed, fog, wind">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 15a4 4 0 0 1 .6-7.95A5 5 0 0 1 17 8.5a3.5 3.5 0 0 1 0 6.5" /><path d="M9 18l-1 2M13 18l-1 2M17 17l-1 2" /></svg>
        </button>
        <button class="dock-btn" data-open="scene" aria-label="Scene" title="Scene: background, bokeh, streaks">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 16l5-5 4 4 3-3 6 6" /><circle cx="15.5" cy="9" r="1.4" /></svg>
        </button>
        <button class="dock-btn" data-open="logo" aria-label="Logo" title="Logo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5c3 4 6 7.2 6 10.5a6 6 0 0 1-12 0c0-3.3 3-6.5 6-10.5z" /></svg>
        </button>
        <button class="dock-btn" id="drawToggle" aria-label="Draw" title="Draw on the glass (B)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19z" /><path d="M14 7l3 3" /></svg>
        </button>
        <button class="dock-btn" data-open="settings" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" /></svg>
        </button>
      </div>

      <!-- Draw: the dock becomes this strip -->
      <div id="drawBox" class="draw-strip" aria-label="Drawing tools">
        <div class="seg" role="group" aria-label="Tool">
          <button class="chip on" id="drawBrush" title="Draw (the tool you start with)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19z" /><path d="M14 7l3 3" /></svg> Brush
          </button>
          <button class="chip" id="drawEraser" title="Rub out (E). A pen's eraser end works too.">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 20h12M5 15l9-9 5 5-9 9H8z" /></svg> Eraser
          </button>
        </div>
        <label class="strip-slider" title="Brush size (or scroll while drawing)">Size <input id="drawSize" type="range" min="2" max="80" step="0.5" /><output></output></label>
        <label class="chip" title="Pen pressure changes the width"><input id="drawPressure" type="checkbox" /> Pressure</label>
        <button class="icon-btn" id="drawUndo" aria-label="Undo" title="Undo (Ctrl+Z)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5" /><path d="M4 9h10a6 6 0 0 1 0 12h-3" /></svg>
        </button>
        <button class="icon-btn" id="drawClear" aria-label="Clear drawing" title="Clear drawing">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" /></svg>
        </button>
        <button class="done-btn" id="drawDone" title="Finish drawing (B)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg> Done
        </button>
      </div>
    </nav>

    <input id="logoFile" type="file" hidden />
    <input id="audioFile" type="file" accept="audio/*" hidden />
    <input id="imageFile" type="file" accept="image/*" hidden />
  </div>

  <canvas id="logoOverlay"></canvas>
  <div id="debug" class="debug" hidden></div>
  <div id="dropzone">Drop a logo</div>
  <div id="toast"></div>
  <div id="fatal" hidden></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
